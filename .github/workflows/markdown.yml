name: Documentation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate documents and generated artifacts without rewriting
        run: python -m tools.workflow check
