name: Documentation
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate documents and generated artifacts without rewriting
        run: python -m tools.workflow check
