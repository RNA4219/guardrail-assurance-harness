name: Security posture
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check local security posture
        run: python tools/ci/check_security_posture.py --check
