name: Governance
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate Full adoption and docs/acceptance
        run: python -m tools.workflow check
      - name: Check branch protection desired configuration
        run: python -m tools.workflow check-branch-protection
      - name: Check policy and ci-config with check_ci_gate_matrix
        run: python tools/ci/check_ci_gate_matrix.py
