name: Governance
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate Full adoption and docs/acceptance
        run: python -m tools.workflow check
      - name: Check branch protection desired configuration
        run: python -m tools.workflow check-branch-protection
      - name: Check policy and ci-config with check_ci_gate_matrix
        run: python tools/ci/check_ci_gate_matrix.py
